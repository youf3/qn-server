  mongo:
    image: mongo
    restart: always
    networks:
      - qnet-backend

  mosquitto:
    image: eclipse-mosquitto:latest
    hostname: mosquitto
    restart: always
    networks:
      - qnet-backend
    ports:
      - "1883:1883"
    volumes:
      - ./conf/:/mosquitto/config/

networks:
  qnet-frontend:
    driver: bridge
  qnet-backend:
    driver: bridge
