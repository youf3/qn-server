services:
  controller:
    image: ghcr.io/quant-net/qn-server:${IMAGE_TAG:-develop}
    restart: always
    networks:
      - qnet-backend
    command: ["quantnet_controller", "--mq-broker-host", "mosquitto"]
    environment:
      - QUANTNET_ENTRYPOINT_DROP_ALL_DB=1
      - QUANTNET_HOME=/opt/quantnet
      - QUANTNET_LINK_ADJACENCY=${QUANTNET_LINK_ADJACENCY:-false}
    volumes:
      - ./conf/:/opt/quantnet/etc/
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - mosquitto
      - mongo

  portal:
    image: ghcr.io/quant-net/qn-api:${IMAGE_TAG:-develop}
    restart: always
    networks:
      - qnet-backend
    expose:
      - 9000
    ports:
      - "9000:8081"
    command: ["python", "main.py"]
    environment:
      - QUANTNET_HOME=/quant-net-api
    volumes:
      - ./conf/:/opt/quantnet/etc/
    depends_on:
      - mosquitto

  agent-1:
    image: ghcr.io/quant-net/qn-agent:${IMAGE_TAG:-develop}
    restart: always
    networks:
      - qnet-backend
    command: ["quantnet_agent", "--mq-broker-host", "mosquitto", "--no-repl", "-a", "LBNL-Q", "-n", "/qn-mq/quantnet_mq/schema/examples/topology/conf_lbnl-q.json"]
    environment:
      - QUANTNET_ENTRYPOINT_DELAY=15
      - QUANTNET_HOME=/opt/quantnet
    volumes:
      - ./conf/:/opt/quantnet/etc/
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - mosquitto

  agent-2:
    image: ghcr.io/quant-net/qn-agent:${IMAGE_TAG:-develop}
